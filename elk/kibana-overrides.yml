# Réglages spécifiques à ce lab, ajoutés à la suite de
# /etc/kibana/kibana.yml par scripts/deploy-kibana-config.sh. Contrairement
# à Elasticsearch (voir elk/README.md pour les deux bugs réels rencontrés
