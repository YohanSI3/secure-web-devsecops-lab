# Pipeline Logstash de ce lab -- déployé par
# scripts/deploy-logstash-pipeline.sh vers
# /etc/logstash/conf.d/secure-web-lab.conf (pipelines.yml du paquet
# pointe déjà sur ce dossier par défaut, aucune modification nécessaire
# là -- voir elk/README.md).
#
# Voir Notes/elk/logstash.md pour le fonctionnement général du pipeline
# entrée/filtre/sortie.

input {
  beats {
    port => 5044
  }
}

filter {
  if [fields][service] == "nginx" and [fields][log_type] == "access" {
    # Motif construit à partir du log_format "security_log" réel de ce
    # lab (nginx/conf.d/logging.conf), pas d'un format Nginx générique --
    # voir nginx/README.md#journalisation-avancée.
    grok {
      match => {
        "message" => '%{IPORHOST:client_ip} - %{NOTSPACE:remote_user} \[%{HTTPDATE:nginx_timestamp}\] "%{WORD:http_method} %{NOTSPACE:request_path} HTTP/%{NUMBER:http_version}" %{NUMBER:response_status:int} %{NUMBER:body_bytes_sent:int} "%{DATA:http_referer}" "%{DATA:user_agent}" rt=%{NUMBER:request_time:float} ssl="%{DATA:ssl_info}" req_id=%{NOTSPACE:request_id}'
      }
    }
    date {
      match => ["nginx_timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
      remove_field => ["nginx_timestamp"]
    }
    mutate {
      add_field => { "service" => "nginx" }
    }
  }

  if [fields][service] == "fail2ban" {
    # Format fail2ban réel observé (Notes/fail2ban/README.md), mais avec un
    # détail non visible dans cet exemple-là : fail2ban aligne en colonnes
    # avec un nombre variable d'espaces, pas un espace unique -- entre le
    # nom du module et "[PID]" ("fail2ban.actions        [205]:", le nom
    # du module le plus court padding pour aligner sur le plus long), et
    # entre le niveau et le message ("INFO      encoding..."). D'où `\s+`
    # plutôt qu'un espace littéral à ces deux endroits -- un espace unique
    # faisait échouer le grok sur 100% des lignes fail2ban réelles (bug
    # réel, voir elk/README.md).
    grok {
      match => {
        "message" => '%{TIMESTAMP_ISO8601:fb_timestamp} fail2ban\.%{WORD:fb_module}\s+\[%{NUMBER:fb_pid}\]:\s+%{WORD:fb_level}\s+%{GREEDYDATA:fb_message}'
      }
    }
    date {
      match => ["fb_timestamp", "yyyy-MM-dd HH:mm:ss,SSS"]
      target => "@timestamp"
      remove_field => ["fb_timestamp"]
    }
    # Deuxième passe ciblée sur les lignes de bannissement réel
    # ("[<jail>] Ban <ip>") -- extrait l'IP dans un champ dédié,
    # directement exploitable pour la corrélation avec les autres logs
    # de ce lab (objectif explicite de cette phase, voir ToDo.md).
    if [fb_message] =~ /Ban / {
      grok {
        match => {
          "fb_message" => '\[%{DATA:fb_jail}\] Ban %{IP:banned_ip}'
        }
        tag_on_failure => ["_grokparsefailure_fb_ban"]
      }
    }
    mutate {
      add_field => { "service" => "fail2ban" }
    }
  }

  if [fields][service] == "postgresql" {
    # Format réel construit par log_line_prefix = '%m [%p] %q%u@%d %h '
    # (scripts/harden-postgresql.sh) : "2026-10-02 17:27:11.590 CEST
    # [2530] secure_web_lab_app@secure_web_lab 127.0.0.1 FATAL:  ...".
    # %q supprime user@db pour les processus d'arrière-plan (checkpointer,
    # autovacuum...) sans session cliente -- ces lignes-là ne matchent pas
    # ce motif (user@db absent) et resteront non-parsées, pas un problème
    # pour l'objectif de ce lab (surveiller les connexions/authentifications,
    # pas les tâches internes du moteur).
    grok {
      match => {
        "message" => '%{TIMESTAMP_ISO8601:pg_timestamp} %{WORD:pg_tz} \[%{NUMBER:pg_pid}\] %{USERNAME:pg_user}@%{USERNAME:pg_db} %{IPORHOST:pg_host} %{WORD:pg_level}:\s+%{GREEDYDATA:pg_message}'
      }
    }
    date {
      match => ["pg_timestamp", "yyyy-MM-dd HH:mm:ss.SSS"]
      target => "@timestamp"
      remove_field => ["pg_timestamp"]
    }
    mutate {
      add_field => { "service" => "postgresql" }
    }
  }

  if [fields][service] == "vault" {
    # Format réel observé via journalctl -u vault : "2026-10-02T17:41:55.386+0200
    # [INFO]  message" -- horodatage déjà au format ISO8601 avec offset
    # numérique, pas besoin de filtre `date` séparé pour le fuseau.
    grok {
      match => {
        "message" => '%{TIMESTAMP_ISO8601:vault_timestamp} \[%{WORD:vault_level}\]\s+%{GREEDYDATA:vault_message}'
      }
    }
    date {
      match => ["vault_timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["vault_timestamp"]
    }
    mutate {
      add_field => { "service" => "vault" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://127.0.0.1:9200"]
    index => "secure-web-lab-logs-%{+YYYY.MM.dd}"
    ssl_certificate_authorities => ["/etc/logstash/certs/http_ca.crt"]
    user => "logstash_internal"
    # Nom de clé en minuscules : logstash-keystore normalise
    # automatiquement les noms passés à `add` (constaté en pratique, voir
    # scripts/setup-logstash-elasticsearch-role.sh et elk/README.md).
    password => "${logstash_es_password}"
  }
}
