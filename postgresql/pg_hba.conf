# Authentification PostgreSQL de ce lab -- déployé par
# scripts/deploy-postgresql-hba.sh vers /etc/postgresql/<version>/main/pg_hba.conf.
# Voir postgresql/README.md pour le détail de chaque choix.
#
# TYPE    DATABASE        USER                    ADDRESS         METHOD

# Administration locale (socket Unix) : peer -- le rôle PostgreSQL doit
# correspondre au nom de l'utilisateur système connecté, aucun mot de passe
# à gérer ici. Utilisé uniquement via `sudo -u postgres psql` pour les
# tâches ponctuelles d'administration (création de rôle, migrations
# manuelles) -- jamais par le backend applicatif.
local   all             postgres                                peer
local   all             all                                     peer

# Backend applicatif (Node.js), ou tout rôle émis dynamiquement par Vault
# pour lui (voir vault/README.md) : connexion TCP en boucle locale
# uniquement, restreinte à SA base et aux membres du rôle de groupe
# "secure_web_lab_app" -- "+role" matche le rôle lui-même ET tout rôle qui
# en est membre (c'est exactement ainsi que Vault accorde les mêmes
# privilèges à chaque identifiant dynamique qu'il crée : `IN ROLE
# secure_web_lab_app` à la création, voir vault/README.md). Toujours plus
# restreint que le défaut Ubuntu ("host all all 127.0.0.1/32 ..."), qui
# autoriserait n'importe quel rôle PostgreSQL à se connecter à n'importe
# quelle base depuis 127.0.0.1. scram-sha-256 : méthode moderne (remplace
# l'ancien md5), déjà la valeur de password_encryption sur cette
# installation.
host    secure_web_lab  +secure_web_lab_app     127.0.0.1/32    scram-sha-256
host    secure_web_lab  +secure_web_lab_app     ::1/128         scram-sha-256

# Rôle d'administration dédié à Vault (voir
# scripts/setup-vault-postgres-admin.sh) : crée/détruit les rôles
# dynamiques ci-dessus, jamais utilisé par l'application elle-même -- même
# logique que le rôle "postgres" superuser, mais scopé (CREATEROLE +
# appartenance à secure_web_lab_app, pas superuser complet).
host    secure_web_lab  vault_admin             127.0.0.1/32    scram-sha-256
host    secure_web_lab  vault_admin             ::1/128         scram-sha-256

# Pas de ligne "replication" : aucune réplication configurée dans ce lab
# (instance unique) -- pas de méthode d'authentification active pour une
# fonctionnalité jamais utilisée (voir postgresql/README.md).
