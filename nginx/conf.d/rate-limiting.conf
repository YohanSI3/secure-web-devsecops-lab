# Zone de rate limiting, déclarée obligatoirement au niveau http :
# limit_req_zone ne peut pas être répétée dans un contexte server/location,
# donc ici (conf.d) plutôt que dans snippets/ (inclus depuis server/location).
# Une seule zone, partagée entre les 3 environnements (une seule instance
# Nginx tourne pour les trois) — voir nginx/README.md#rate-limiting pour ce
# choix et Notes/nginx/rate-limiting/ pour le fonctionnement général.
limit_req_zone $binary_remote_addr zone=lab:10m rate=10r/s;

# 429 (Too Many Requests, RFC 6585) plutôt que le 503 par défaut : distingue
# clairement pour le client "vous envoyez trop vite" de "le serveur est en
# panne".
limit_req_status 429;

# Un rejet par rate limiting est une application de politique, pas une
# panne : "warn" plutôt que le "error" par défaut. Sans changement
# correspondant du niveau de error_log dans chaque vhost (voir
# nginx/README.md#journalisation-avancée), ces messages "warn" resteraient
# silencieusement absents du fichier -- error_log ne garde par défaut que
# "error" et plus grave.
limit_req_log_level warn;
