# Format de log enrichi (timing, TLS négocié, identifiant de corrélation),
# déclaré une fois au niveau http -- doit ensuite être référencé
# explicitement dans chaque directive access_log de chaque vhost (même
# logique déclaration/application que limit_req_zone, voir la règle
# conf.d/ vs snippets/ en tête de ce fichier). Voir nginx/README.md et
# Notes/nginx/journalisation/.
log_format security_log
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time ssl="$ssl_protocol/$ssl_cipher" '
    'req_id=$request_id';
