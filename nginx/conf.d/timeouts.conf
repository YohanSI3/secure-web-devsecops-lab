# Timeouts resserrés par rapport aux défauts Nginx (60-75s). Toutes ces
# directives s'appliquent automatiquement par héritage à tous les server
# blocks (voir nginx/README.md pour la règle conf.d/ vs snippets/) : aucune
# inclusion à faire ni à oublier ailleurs.
# Voir nginx/README.md#timeouts-adaptés et Notes/nginx/timeouts/.

# Délai max entre deux lectures successives des en-têtes / du corps de
# requête envoyés par le client (pas une durée totale de requête -- voir
# la note pour cette nuance et sa limite).
client_header_timeout 10s;
client_body_timeout   10s;

# Délai max entre deux écritures successives de la réponse vers le client.
send_timeout 10s;

# Durée pendant laquelle une connexion keep-alive reste ouverte en
# attendant une requête suivante du même client.
keepalive_timeout 65s;
