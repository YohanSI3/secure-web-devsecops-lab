# Bornes explicites sur la taille des requêtes acceptées, au niveau http
# (s'applique donc aussi aux server blocks HTTP de redirection, pas
# seulement aux vhosts HTTPS). Site purement statique, aucun upload prévu :
# une limite basse coupe court aux tentatives d'envoi de payloads
# volumineux sans aucun impact sur un usage réel de ce site.
# Voir nginx/README.md#controle-des-tailles-de-requetes et
# Notes/nginx/controle-tailles-requetes/.
client_max_body_size 100k;
client_body_buffer_size 16k;

# Bornes sur la ligne de requête + les en-têtes (surface différente du
# corps de requête ci-dessus) : valeurs par défaut de Nginx, déclarées ici
# explicitement plutôt que laissées implicites.
client_header_buffer_size 1k;
large_client_header_buffers 4 8k;
