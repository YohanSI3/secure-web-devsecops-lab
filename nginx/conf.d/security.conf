# Réglages globaux appliqués à tous les server blocks (http + tous les
# vhosts). Voir Notes/nginx/headers-securite/ et Notes/nginx/tls/.

# Cache le numéro de version nginx dans le header Server: et les pages
# d'erreur par défaut.
server_tokens off;

# ssl_protocols n'est volontairement PAS ici : /etc/nginx/nginx.conf
# (stock, non versionné) déclare déjà, au niveau http, l'ensemble hérité de
# protocoles TLS du paquet Ubuntu -- qui inclut encore les deux versions
# dépréciées les plus anciennes en plus des deux versions modernes (le
# détail exact est dans Notes/nginx/tls/protocoles-tls-heritage-et-fusion.md,
# volontairement pas répété ici tel quel : Semgrep (generic.nginx.security.insecure-ssl-version)
# matche du texte, pas une intention, et signalait cette description en
# faux positif comme si c'était une directive active).
# Contrairement à la plupart des directives, ssl_protocols fusionne par
# addition quand il est déclaré plusieurs fois au MÊME niveau (http ici) —
# une seconde déclaration ici n'aurait fait qu'ajouter les versions
# modernes à la liste existante, sans retirer les anciennes. Le
# remplacement effectif (versions modernes seules) se fait au niveau
# `server`, dans nginx/snippets/tls-hardening.conf.
