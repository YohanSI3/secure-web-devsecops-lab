# Réglages globaux appliqués à tous les server blocks (http + tous les
# vhosts). Voir Notes/nginx/headers-securite/ et Notes/nginx/tls/.

# Cache le numéro de version nginx dans le header Server: et les pages
# d'erreur par défaut.
server_tokens off;

# ssl_protocols n'est volontairement PAS ici : /etc/nginx/nginx.conf
# (stock, non versionné) déclare déjà `ssl_protocols TLSv1 TLSv1.1 TLSv1.2
# TLSv1.3;` au niveau http. Contrairement à la plupart des directives,
# ssl_protocols fusionne par addition quand il est déclaré plusieurs fois
# au MÊME niveau (http ici) — une seconde déclaration ici n'aurait fait
# qu'ajouter TLSv1.2/1.3 à la liste existante, sans retirer TLSv1/1.1.
# Le remplacement effectif se fait au niveau `server`, dans
# nginx/snippets/tls-hardening.conf — voir
# Notes/nginx/tls/protocoles-tls-heritage-et-fusion.md.
