# Rotation des logs par-site de ce lab, séparée de la config livrée par le
# paquet Ubuntu (/etc/logrotate.d/nginx, qui ne gère plus que les logs
# génériques après restriction de son glob par scripts/setup-log-rotation.sh)
# pour éviter que les deux configs ne se disputent les mêmes fichiers.
# Voir nginx/README.md#rotation-de-logs et Notes/nginx/rotation-logs/.
/var/log/nginx/secure-web-lab-*.access.log
/var/log/nginx/secure-web-lab-*.error.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 root adm
    sharedscripts
    postrotate
        [ -f /run/nginx.pid ] && kill -USR1 "$(cat /run/nginx.pid)"
    endscript
}
