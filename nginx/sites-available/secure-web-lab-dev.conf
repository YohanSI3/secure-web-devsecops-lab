server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    server_name dev.secure-web-lab.local;

    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;

    server_name dev.secure-web-lab.local;

    ssl_certificate     /etc/nginx/ssl/dev/server.crt;
    ssl_certificate_key /etc/nginx/ssl/dev/server.key;

    include snippets/tls-hardening.conf;
    include snippets/security-headers.conf;
    include snippets/custom-error-pages.conf;

    root /var/www/secure-web-lab-dev;
    index index.html;

    autoindex on;
    add_header X-Environment "dev" always;
    add_header X-Request-Id $request_id always;

    access_log /var/log/nginx/secure-web-lab-dev.access.log security_log;
    error_log  /var/log/nginx/secure-web-lab-dev.error.log warn;

    location / {
        include snippets/rate-limiting.conf;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        include snippets/rate-limiting.conf;
        include snippets/api-proxy.conf;
    }

    # location = (correspondance exacte) : passe avant le préfixe /api/
    # ci-dessus pour ces routes précises, sans affecter le reste de l'API.
    # Les trois partagent la même zone stricte "login" (voir
    # nginx/conf.d/rate-limiting.conf) : connexion, demande de reset et
    # soumission de reset sont toutes les trois des cibles plausibles de
    # brute-force/abus, pas seulement la connexion elle-même.
    location = /api/auth/login {
        include snippets/rate-limiting-login.conf;
        include snippets/api-proxy.conf;
    }

    location = /api/auth/forgot-password {
        include snippets/rate-limiting-login.conf;
        include snippets/api-proxy.conf;
    }

    location = /api/auth/reset-password {
        include snippets/rate-limiting-login.conf;
        include snippets/api-proxy.conf;
    }
}
