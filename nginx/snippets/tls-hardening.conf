# Restreint les protocoles TLS acceptés, au niveau server (remplace la
# valeur héritée du niveau http plutôt que de s'y ajouter). Inclus dans
# chaque server block "ssl" du lab.
# Voir Notes/nginx/tls/protocoles-tls-heritage-et-fusion.md.
ssl_protocols TLSv1.2 TLSv1.3;

# Suites de chiffrement pour TLS 1.2 uniquement (TLS 1.3 impose son propre
# jeu fixe de suites AEAD, non configurable via ssl_ciphers) : uniquement
# ECDHE (forward secrecy) + AEAD (GCM/ChaCha20-Poly1305), aucune suite CBC,
# RC4, 3DES, ni échange de clé RSA statique. Pas de repli DHE (nécessiterait
# de générer un ssl_dhparam pour aucun bénéfice réel : aucun client ancien
# à supporter dans ce lab). Voir nginx/README.md#suites-de-chiffrement et
# Notes/nginx/tls/durcissement-suites-ocsp-resumption.md.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

# Réutilisation de session : cache partagé entre workers (10 Mo, de l'ordre
# de quelques dizaines de milliers de sessions), tickets de session
# désactivés. Voir nginx/README.md#reprise-de-session pour le compromis
# forward secrecy / gestion de clé qui justifie ce choix.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_session_tickets off;

# OCSP stapling : syntaxe de référence, VOLONTAIREMENT PAS ACTIVÉE ici.
# La CA locale de ce lab (.tls/ca/) est auto-signée et ne dispose d'aucun
# répondeur OCSP -- ssl_stapling n'aurait littéralement rien à agrafer et
# ne produirait que des tentatives de requête échouées dans les logs
# d'erreur. Voir nginx/README.md#ocsp-stapling pour le détail et ce qu'il
# faudrait pour l'activer avec un vrai certificat (Let's Encrypt ou CA
# publique).
#
# ssl_stapling on;
# ssl_stapling_verify on;
# ssl_trusted_certificate /etc/nginx/ssl/<env>/ca.crt;
# resolver 1.1.1.1 8.8.8.8 valid=300s;
# resolver_timeout 5s;
