# Page d'erreur générique, sans aucune référence à Nginx (voir
# nginx/README.md#protection-contre-divulgation-de-version). Doit être un
# snippet, pas conf.d/ : le bloc `location` ci-dessous ne peut exister qu'à
# l'intérieur d'un bloc server, jamais directement au niveau http (voir la
# règle conf.d/ vs snippets/ en tête de nginx/README.md).
error_page 403 404 405 413 429 500 502 503 504 /error.html;

location = /error.html {
    internal;
}
