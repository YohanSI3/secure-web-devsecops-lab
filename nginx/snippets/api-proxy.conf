# Reverse proxy vers le backend applicatif (Node.js/Express), toujours en
# écoute sur 127.0.0.1 uniquement (voir app/backend/src/index.js) --
# inclus dans le location /api/ des vhosts qui exposent le backend.
# Voir app/backend/README.md et Notes/nodejs/.
proxy_pass http://127.0.0.1:3000/;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
