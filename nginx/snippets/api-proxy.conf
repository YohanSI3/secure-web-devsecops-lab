# Reverse proxy vers le backend applicatif (Node.js/Express), toujours en
# écoute sur 127.0.0.1 uniquement (voir app/backend/src/index.js) --
# inclus dans le location /api/ (préfixe) des vhosts qui exposent le
# backend. NE PAS réutiliser tel quel dans une location = (correspondance
# exacte) : voir api-proxy-headers.conf pour pourquoi.
# Voir app/backend/README.md et Notes/nodejs/.
proxy_pass http://127.0.0.1:3000/;
include snippets/api-proxy-headers.conf;
