# Headers de sécurité de base, communs aux trois environnements.
# Inclus depuis chaque server block HTTPS via `include snippets/security-headers.conf;`.
# Détail de chaque header : Notes/nginx/headers-securite/en-tetes-expliques.md

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
