# En-têtes communs pour tout reverse proxy vers le backend Node.js.
# Factorisés séparément de proxy_pass (voir api-proxy.conf et
# nginx/README.md#api-reverse-proxy) : proxy_pass avec une URI finale
# (`http://host:port/;`) ne se comporte pas pareil selon que la location
# qui l'utilise est un préfixe (`location /api/`, où la portion préfixe
# est retirée puis remplacée -- comportement voulu) ou une correspondance
# exacte (`location = /api/auth/login`, où c'est l'URI **entière** qui
# est considérée comme "la portion préfixe" et donc entièrement remplacée
# par `/`) -- les location = doivent donc déclarer leur propre proxy_pass
# explicite plutôt que réutiliser celui d'api-proxy.conf.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
