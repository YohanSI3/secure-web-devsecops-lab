name: SAST (Semgrep)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7

      # Rulesets publics du Semgrep Registry, aucune authentification
      # requise (contrairement à `--config auto`, qui suppose un compte
      # Semgrep). p/security-audit : règles génériques (injection, crypto
      # faible, etc.). r/bash : scripts shell (préfixe r/ = toutes les
      # règles d'un langage, pas de pack curé pour bash -- voir plus bas).
      # p/nodejsscan / p/expressjs : règles dédiées Node.js/Express, le
      # backend applicatif de la Phase 5 (IAM).
      - name: Semgrep scan
        run: semgrep scan --config p/security-audit --config r/bash --config p/nodejsscan --config p/expressjs --error
