name: Secrets scan (gitleaks)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet, pas seulement le dernier commit : un
          # secret déjà committé puis "supprimé" dans un commit suivant
          # reste présent dans l'historique git.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
