name: Secrets scan (gitleaks)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet, pas seulement le dernier commit : un
          # secret déjà committé puis "supprimé" dans un commit suivant
          # reste présent dans l'historique git.
          fetch-depth: 0

      # gitleaks-action >= 2 exige GITHUB_TOKEN explicitement pour scanner
      # une pull request (appel à l'API GitHub pour récupérer le diff de
      # la PR) -- sans ce token, le job échoue immédiatement avant même de
      # lancer un scan, indépendamment de tout secret réel dans le dépôt.
      # v3 (pas juste v2) : v2 tourne sur Node 20, supprimé des runners
      # GitHub le 16/09/2026 -- v3 migre vers Node 24, aucun changement de
      # comportement/entrées sinon (voir le guide de migration du projet).
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
