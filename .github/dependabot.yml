version: 2
updates:
  # Seule vraie surface de "dépendances" du dépôt à ce stade : les
  # versions des actions GitHub référencées dans .github/workflows/
  # (@v4, etc.). Épinglées par tag plutôt que par SHA de commit -- Dependabot
  # ouvre une PR à chaque nouvelle version, donnant le contrôle humain
  # (revue + CI) sur chaque mise à jour plutôt qu'une dérive silencieuse.
  # Voir .github/README.md#dependabot pour la nuance tag vs SHA.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
