# Filtre personnalisé pour ce lab (absent des filtres livrés avec fail2ban).
# app/static-site/ ne sert que index.html et style.css : toute autre
# requête aboutissant en 404 est un signal d'énumération/scan, pas un usage
# légitime. Voir fail2ban/README.md.
[Definition]
failregex = ^<HOST> -.*"(GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) \S+ HTTP/\d\.\d" 404
ignoreregex =
