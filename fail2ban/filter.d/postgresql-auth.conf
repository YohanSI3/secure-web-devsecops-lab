# Filtre personnalisé pour ce lab (absent des filtres livrés avec
# fail2ban) : échecs d'authentification PostgreSQL, qu'ils viennent d'un
# mauvais mot de passe ou d'un accès refusé par pg_hba.conf (voir
# postgresql/README.md). Suppose log_line_prefix = '%m [%p] %q%u@%d %h '
# (voir scripts/harden-postgresql.sh) -- sans le `%h` ajouté là, aucune IP
# n'apparaît dans ces lignes pour que <HOST> puisse la capturer.
[Definition]
failregex = ^.*\s<HOST>\s+FATAL:\s+password authentication failed for user
            ^.*\s<HOST>\s+FATAL:\s+no pg_hba\.conf entry for host
ignoreregex =
